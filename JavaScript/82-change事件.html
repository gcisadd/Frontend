<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
  <input type="text">
  <script>

      console.log("change事件触发", e.target.value)
    })
  </script>
